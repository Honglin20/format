[project]
name = "bitx"
dynamic = ["version"]
description = 'Quantization error analysis library built on microxcaling'
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.16",
    "torchaudio>=2.1.0"
]
license = { file = "LICENSE" }
keywords = ["bitx", "quantization", "analysis", "mx", "microxcaling", "deep learning", "pytorch"]
authors = [
  { name = "The Microsoft CAST Algorithms Team", email = "placeholder@microsoft.com" },
]

[build-system]
requires = ["hatchling", "hatch-vcs", "wheel"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/mx",
    "/src",
]

[tool.hatch.build.targets.wheel]
include = [
    "/mx",
    "/src",
]

# Install src/ under both names:
#   from src.session import ...  (backward compat, dev with PYTHONPATH)
#   from bitx.session import ... (clean installed name)
[tool.hatch.build.targets.wheel.force-include]
"src" = "bitx"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "." }

[tool.hatch.build.hooks.vcs]
version-file = "_version.py"
